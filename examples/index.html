<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkDesktop 纯 HTML 引入示例（UMD）</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <!-- 组件库样式与 UMD 产物 -->
  <link rel="stylesheet" href="../dist/style.css" />
</head>

<body>
  <div id="app"></div>

  <!-- 依赖：Vue3 / ElementPlus / 图标 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue/dist/index.iife.min.js"></script>
  <!-- WorkDesktop UMD（全局 WorkDesktop） -->
  <script src="../dist/index.umd.js"></script>

  <script>
    // 全局配置注入（script 场景入口，等价于 npm 场景的 app.use(WorkDesktop, config)）
    // WorkDesktop 采用「三级配置覆盖」：默认层 → 全局层 → 组件 Props
    window.workDesktopConfig = {
      // 全局配置分页默认每页数量
      page: { pager: { pageSize: 5 } },
      // 配置 API 响应格式适配你的后端
      response: {
        props: { codeName: 'code', messageName: 'message', dataName: 'data' },
        successCode: 0
      },
      // 全局配置请求前缀
      request: { urlPrefix: '/api' }
    }

    const { createApp } = Vue
    // UMD 全局 WorkDesktop 具名导出：request（手动请求单例）/ setGlobalConfig / useGlobalConfig / useRequest
    const { request, setGlobalConfig, useGlobalConfig } = WorkDesktop

    const app = createApp({
      setup() {
        // 读取当前全局配置（非响应式）
        const config = useGlobalConfig()

        // 示例：手动调用 GET 请求（request 单例）
        const handleManualGet = async () => {
          try {
            // 返回 ApiResult { success, data, code, message }；业务失败 resolve(success=false)，网络异常 reject
            const result = await request.get('/user/list', { currentPage: 1, pageSize: 5 })
            if (result.success) {
              ElementPlus.ElMessage.success('请求成功，共 ' + result.data.total + ' 条')
            } else {
              ElementPlus.ElMessage.warning('业务失败：' + result.message)
            }
          } catch (error) {
            // 网络异常分支
            console.error('请求失败', error)
          }
        }

        // 示例：运行中修改全局配置（setGlobalConfig 增量合并，影响新挂载组件）
        const changePageSize = () => {
          setGlobalConfig({ page: { pager: { pageSize: 10 } } })
          ElementPlus.ElMessage.success('已将全局分页大小修改为 10 条')
        }

        return {
          handleManualGet,
          changePageSize
        }
      },
      data() {
        return {
          rows: [
            { id: 1, name: '项目 A', owner: '张三', status: 1 },
            { id: 2, name: '项目 B', owner: '李四', status: 0 },
            { id: 3, name: '项目 C', owner: '王五', status: 1 },
            { id: 4, name: '项目 D', owner: '赵六', status: 1 },
            { id: 5, name: '项目 E', owner: '钱七', status: 0 },
            { id: 6, name: '项目 F', owner: '孙八', status: 1 },
            { id: 7, name: '项目 G', owner: '周九', status: 0 }
          ],
          roles: [
            { value: 1, text: '管理员' },
            { value: 2, text: '编辑' },
            { value: 3, text: '访客' }
          ],
          role: 1,
          enabled: true
        }
      },
      methods: {
        onRoleChange(val) {
          ElementPlus.ElMessage.info('选择角色：' + val)
        },
        onSwitch(val) {
          ElementPlus.ElMessage.success('开关状态：' + (val ? '开' : '关'))
        },
        onApiClick() {
          ElementPlus.ElMessage.success('ApiButton 触发 click（无接口）')
        },
        statusText(row) {
          return row.status === 1 ? '启用' : '禁用'
        }
      },
      template: `
          <div style="max-width: 900px; margin: 24px auto; padding: 0 16px">
            <h2 style="margin-bottom: 4px">WorkDesktop 纯 HTML 引入</h2>
            <p style="color:#909399; font-size:13px; margin-top:0">
              通过 script 标签引入 UMD 产物，全局 <code>WorkDesktop</code> 插件注册全部 wd-* 组件。
            </p>

            <wd-panel title="1. 全局配置演示" description="useGlobalConfig 读取 / setGlobalConfig 修改全局配置">
              <div style="display:flex; gap:16px; align-items:center">
                <el-button type="primary" @click="changePageSize">修改全局分页大小为 10</el-button>
                <wd-tips type="text" tips="setGlobalConfig() 增量合并到全局层，返回新配置；修改后新挂载组件生效"></wd-tips>
              </div>
              <div style="margin-top: 8px; font-size: 13px; color: #606266">
                <p><strong>配置规则：</strong>三级覆盖 → 默认层 → 全局层（window.workDesktopConfig 或 setGlobalConfig）→ 组件 Props</p>
                <p><strong>常用全局配置项：</strong></p>
                <ul>
                  <li><code>request.urlPrefix</code>: 请求前缀（如 /api /mock）</li>
                  <li><code>response.props.codeName</code>: 响应状态码字段名，默认 code</li>
                  <li><code>response.successCode</code>: 成功状态码，默认 0</li>
                  <li><code>page.pager.pageSize</code>: 默认分页大小</li>
                  <li><code>theme.colors</code>: 主题色彩令牌覆盖</li>
                </ul>
              </div>
            </wd-panel>

            <wd-panel title="2. 手动 HTTP 请求演示" description="request 单例手动发起 API 请求">
              <div style="display:flex; gap:16px; align-items:center">
                <el-button type="success" @click="handleManualGet">发起 GET 请求演示</el-button>
                <wd-tips type="text" tips="request 单例提供 get/post/put/delete/request，自动加 urlPrefix、loading、提示、解封响应"></wd-tips>
              </div>
              <div style="margin-top: 8px; font-size: 13px; color: #606266">
                <p><strong>使用方式：</strong></p>
<pre style="background:#f5f7fa; padding:8px; border-radius:4px">
// UMD 全局解构手动请求单例
const { request } = WorkDesktop

// 发起 GET 请求，返回 ApiResult { success, data, code, message }
const result = await request.get('/user/list', { currentPage: 1, pageSize: 5 })

// 发起 POST 请求
const created = await request.post('/user/save', { name: '张三' })
</pre>
                <p>自动处理：响应格式转换、成功失败判定、错误消息提示、异常捕获</p>
              </div>
            </wd-panel>

            <wd-panel title="数据表格" description="DataGrid 静态数据 + 分页">
              <wd-data-grid :data-source="rows" row-key="id" :with-index="true">
                <el-table-column prop="id" label="ID" width="80"></el-table-column>
                <el-table-column prop="name" label="项目" min-width="160"></el-table-column>
                <el-table-column prop="owner" label="负责人" width="120"></el-table-column>
                <el-table-column prop="status" label="状态" width="100">
                  <template #default="{ row }">
                    <el-tag :type="row.status === 1 ? 'success' : 'info'" size="small">{{ statusText(row) }}</el-tag>
                  </template>
                </el-table-column>
              </wd-data-grid>
            </wd-panel>

            <wd-panel title="表单控件" description="Select / Switch / Tips / 按钮组">
              <div style="display:flex; flex-wrap:wrap; gap:16px; align-items:center">
                <span>
                  <b>角色：</b>
                  <wd-select v-model="role" :data-source="roles" style="width:160px" @change="onRoleChange"></wd-select>
                </span>
                <span>
                  <b>状态：</b>
                  <wd-switch v-model="enabled" @change="onSwitch"></wd-switch>
                </span>
                <wd-tips type="box" tips="纯 HTML 也可用声明式组件"></wd-tips>
                <wd-tips-button label="悬停提示按钮" tips="基于 el-tooltip 的提示按钮"></wd-tips-button>
                <wd-api-button type="primary" label="请求按钮(事件)" @click="onApiClick"></wd-api-button>
              </div>
            </wd-panel>

            <p style="color:#c0c4cc; font-size:12px; margin-top:24px">
              WorkDesktop UMD 版本：window.WorkDesktop · 全局配置：window.workDesktopConfig<br>
              可用具名导出：request / http / useGlobalConfig / setGlobalConfig / useRequest / useConfig / useDataGrid / useEventBus
            </p>
          </div>
        `
    })

    app.use(ElementPlus)
    app.use(WorkDesktop)
    app.mount('#app')
  </script>
</body>

</html>
